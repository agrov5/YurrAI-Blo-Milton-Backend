<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); min-width: 300px; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border-radius: 4px; border: 1px solid #ccc; }
        button { width: 100%; padding: 0.5rem; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Dashboard Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
        <div class="message" id="message"></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = '';
            // Use the production URL if available, otherwise fallback to relative path
            const apiBase = window.PRODUCTION_URL || (typeof process !== 'undefined' && process.env && process.env.PRODUCTION_URL) || '';
            const endpoint = apiBase ? apiBase.replace(/\/$/, '') + '/api/populateLocal' : '/api/populateLocal';
            try {
                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': username + ':' + password
                    }
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'It worked!';
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = data.message || 'It did not work.';
                }
            } catch (err) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
