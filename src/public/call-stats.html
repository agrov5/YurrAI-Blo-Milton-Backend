<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Statistics — Blo Milton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg:          #07090f;
        --surface:     #0c0f1d;
        --surface2:    #131728;
        --border:      rgba(255,255,255,0.08);
        --border-hi:   rgba(255,255,255,0.18);
        --text:        #eef3ff;
        --muted:       #6d7a9f;
        --accent:      #6366f1;
        --accent-glow: rgba(99,102,241,0.18);
        --purple:      #7c3aed;
        --green:       #22c55e;
        --green-dim:   rgba(34,197,94,0.12);
        --orange:      #f97316;
        --red:         #ef4444;
        --sidebar-w:   224px;
        --topbar-h:    64px;
        --radius-sm:   10px;
        --radius:      16px;
        --radius-lg:   22px;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        overflow-x: hidden;
      }

      /* ── Sidebar ─────────────────────────────────────────── */
      .sidebar {
        width: var(--sidebar-w);
        min-height: 100vh;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        left: 0; top: 0;
        z-index: 100;
        padding: 0 0 1.5rem;
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        padding: 1.25rem 1.25rem 0;
        height: var(--topbar-h);
      }

      .brand-icon {
        width: 32px; height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
        display: flex; align-items: center; justify-content: center;
        font-size: 0.95rem; font-weight: 700; color: #fff;
        flex-shrink: 0;
        box-shadow: 0 4px 14px rgba(99,102,241,0.35);
      }

      .brand-name {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text);
      }

      .sidebar-nav {
        padding: 1.5rem 0.75rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.6rem 0.75rem;
        border-radius: var(--radius-sm);
        color: var(--muted);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: background 0.18s, color 0.18s;
        cursor: pointer;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
      }

      .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
      .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
      .nav-item.is-active {
        background: rgba(99,102,241,0.12);
        color: #a5b4fc;
        border: 1px solid rgba(99,102,241,0.2);
      }

      .sidebar-divider { margin: 0.75rem 1rem; height: 1px; background: var(--border); }

      .sidebar-status {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0 1.25rem;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .pulse-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--green);
        flex-shrink: 0;
        animation: pulse-anim 2.4s ease-in-out infinite;
      }

      @keyframes pulse-anim {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(0.8); }
      }

      /* ── Main ────────────────────────────────────────────── */
      .main {
        margin-left: var(--sidebar-w);
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── Topbar ──────────────────────────────────────────── */
      .topbar {
        height: var(--topbar-h);
        border-bottom: 1px solid var(--border);
        background: rgba(7,9,15,0.85);
        backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        position: sticky;
        top: 0;
        z-index: 50;
        gap: 1rem;
      }

      .topbar-left { display: flex; align-items: center; gap: 1.25rem; }

      .page-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }

      .topbar-right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

      .back-btn {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 500;
        font-family: inherit;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
        text-decoration: none;
        white-space: nowrap;
      }

      .back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); border-color: var(--border-hi); }

      /* Month/year selectors */
      .selector-group { display: flex; align-items: center; gap: 0.5rem; }

      .selector-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--muted);
        white-space: nowrap;
      }

      .selector-input {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.4rem 0.75rem;
        border-radius: var(--radius-sm);
        font-size: 0.82rem;
        font-family: inherit;
        cursor: pointer;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .selector-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
      .selector-input option { background: #131728; color: var(--text); }

      /* ── Content ─────────────────────────────────────────── */
      .content {
        padding: 2rem;
        max-width: 1320px;
        width: 100%;
      }

      /* ── Stat strip ──────────────────────────────────────── */
      .stat-strip {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .stat-tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.4rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        transition: border-color 0.22s, transform 0.22s, box-shadow 0.22s;
        position: relative;
        overflow: hidden;
      }

      .stat-tile::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 2px;
        background: var(--tile-accent, var(--accent));
        opacity: 0.7;
        border-radius: 999px 999px 0 0;
      }

      .stat-tile:hover {
        border-color: var(--border-hi);
        transform: translateY(-3px);
        box-shadow: 0 16px 40px rgba(0,0,0,0.3);
      }

      .tile-icon {
        width: 32px; height: 32px;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        background: var(--tile-icon-bg, rgba(99,102,241,0.12));
        flex-shrink: 0;
      }
      .tile-icon svg { width: 16px; height: 16px; }

      .tile-bottom { display: flex; flex-direction: column; gap: 0.2rem; }

      .tile-val {
        font-size: 1.9rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1;
      }

      .tile-lbl {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ── Call history section ────────────────────────────── */
      .history-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        transition: border-color 0.22s;
      }

      .history-section:hover { border-color: var(--border-hi); }

      .section-head {
        border-bottom: 1px solid var(--border);
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
      }

      .section-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.2rem;
      }

      .section-subtitle { font-size: 0.8rem; color: var(--muted); }

      /* ── Call items ──────────────────────────────────────── */
      .call-item {
        background: rgba(0,0,0,0.15);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 0.85rem;
        overflow: hidden;
        transition: border-color 0.22s, box-shadow 0.22s, transform 0.22s;
      }

      .call-item:last-child { margin-bottom: 0; }

      .call-item:hover {
        border-color: var(--border-hi);
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      }

      .call-header {
        padding: 1rem 1.25rem;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(135deg, rgba(99,102,241,0.06) 0%, rgba(124,58,237,0.04) 100%);
        user-select: none;
      }

      .call-header-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 1rem;
        flex: 1;
      }

      .call-info-item { display: flex; flex-direction: column; gap: 0.15rem; }

      .call-info-label {
        font-size: 0.68rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 600;
      }

      .call-info-value {
        font-size: 0.875rem;
        color: var(--text);
        font-weight: 500;
      }

      .call-expand-icon {
        font-size: 0.7rem;
        color: var(--muted);
        margin-left: 1.25rem;
        flex-shrink: 0;
        transition: transform 0.28s ease;
        opacity: 0.7;
      }

      .call-expand-icon.expanded { transform: rotate(180deg); }

      .call-details {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.32s ease, padding 0.32s ease;
        padding: 0 1.25rem;
      }

      .call-details.expanded {
        max-height: 2400px;
        padding: 1.25rem;
        border-top: 1px solid var(--border);
      }

      .detail-section { margin-bottom: 1.25rem; }
      .detail-section:last-child { margin-bottom: 0; }

      .detail-section-title {
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 600;
        margin-bottom: 0.6rem;
      }

      .detail-content {
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.9rem 1rem;
        color: #c7d2fe;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.85rem;
      }

      .detail-row {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 0.75rem;
        margin-bottom: 0.6rem;
        align-items: start;
      }
      .detail-row:last-child { margin-bottom: 0; }

      .detail-label { color: var(--muted); font-size: 0.8rem; font-weight: 500; }
      .detail-value { color: #d4dbff; font-size: 0.8rem; word-break: break-all; }

      .recording-link {
        color: #818cf8;
        text-decoration: none;
        transition: color 0.18s;
      }
      .recording-link:hover { color: #a5b4fc; text-decoration: underline; }

      /* ── States ──────────────────────────────────────────── */
      .no-calls, .loading-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--muted);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      .spinner {
        width: 20px; height: 20px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Responsive ──────────────────────────────────────── */
      @media (max-width: 1200px) {
        .stat-strip { grid-template-columns: repeat(2, 1fr); }
      }

      @media (max-width: 1024px) {
        .topbar { flex-wrap: wrap; height: auto; padding: 0.75rem 1.25rem; }
        .call-header-info { grid-template-columns: repeat(2, 1fr); }
      }

      @media (max-width: 768px) {
        .sidebar { display: none; }
        .main { margin-left: 0; }
        .content { padding: 1rem; }
        .stat-strip { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        .topbar { padding: 0.75rem 1rem; }
        .detail-row { grid-template-columns: 1fr; gap: 0.25rem; }
        .call-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
        .call-expand-icon { margin-left: 0; }
        .call-header-info { width: 100%; }
      }

      @media (max-width: 480px) {
        .stat-strip { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>

    <!-- ── Sidebar ─────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">Y</div>
        <span class="brand-name">YurrAI</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item" href="/dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a class="nav-item is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.16 6.16l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/></svg>
          Call Stats
        </a>
        <a class="nav-item" href="/manage.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Staff &amp; Treatments
        </a>
      </nav>

      <div class="sidebar-divider"></div>
      <div class="sidebar-status">
        <span class="pulse-dot"></span>
        All systems operational
      </div>
    </aside>

    <!-- ── Main ────────────────────────────────────────────── -->
    <div class="main">

      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <a class="back-btn" href="/dashboard.html">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back
          </a>
          <h1 class="page-title">Call Statistics</h1>
        </div>
        <div class="topbar-right">
          <div class="selector-group">
            <label class="selector-label">Month</label>
            <select class="selector-input" id="monthSelector" onchange="updateStats()">
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>
          <div class="selector-group">
            <label class="selector-label">Year</label>
            <select class="selector-input" id="yearSelector" onchange="updateStats()">
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
              <option value="2027">2027</option>
            </select>
          </div>
        </div>
      </header>

      <!-- Content -->
      <div class="content">

        <!-- Stat strip -->
        <div class="stat-strip">
          <div class="stat-tile" style="--tile-accent: #6366f1; --tile-icon-bg: rgba(99,102,241,0.1);">
            <div class="tile-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
            <div class="tile-bottom">
              <div class="tile-val" id="callCountValue">0</div>
              <div class="tile-lbl">Calls This Month</div>
            </div>
          </div>

          <div class="stat-tile" style="--tile-accent: #22c55e; --tile-icon-bg: rgba(34,197,94,0.1);">
            <div class="tile-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            </div>
            <div class="tile-bottom">
              <div class="tile-val" id="totalCostValue">$0.00</div>
              <div class="tile-lbl">Total Cost (USD)</div>
            </div>
          </div>

          <div class="stat-tile" style="--tile-accent: #f97316; --tile-icon-bg: rgba(249,115,22,0.1);">
            <div class="tile-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="tile-bottom">
              <div class="tile-val" id="totalMinutesValue">0</div>
              <div class="tile-lbl">Total Minutes</div>
            </div>
          </div>

          <div class="stat-tile" style="--tile-accent: #0ea5e9; --tile-icon-bg: rgba(14,165,233,0.1);">
            <div class="tile-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
            </div>
            <div class="tile-bottom">
              <div class="tile-val" id="averageMinutesValue">0</div>
              <div class="tile-lbl">Avg Min / Call</div>
            </div>
          </div>
        </div>

        <!-- Call history -->
        <div class="history-section">
          <div class="section-head">
            <h2 class="section-title">Call History</h2>
            <p class="section-subtitle">All calls for the selected month, most recent first</p>
          </div>
          <div id="callsList"></div>
        </div>

      </div><!-- /content -->
    </div><!-- /main -->

    <script>
      function initializeDateSelectors() {
        const now = new Date();
        document.getElementById("monthSelector").value = now.getMonth() + 1;
        document.getElementById("yearSelector").value  = now.getFullYear();
      }

      function formatDate(isoDate) {
        if (!isoDate) return "N/A";
        return new Date(isoDate).toLocaleDateString("en-US", {
          month:"short", day:"numeric", year:"numeric",
          hour:"2-digit", minute:"2-digit"
        });
      }

      function formatTranscript(transcript) {
        if (!transcript) return "No transcript available";
        return transcript.split("\\n").map(l => escapeHtml(l)).join("\n");
      }

      function escapeHtml(text) {
        const d = document.createElement("div");
        d.textContent = text;
        return d.innerHTML;
      }

      function formatCurrency(amount) {
        if (!amount) return "$0.00";
        return "$" + parseFloat(amount).toFixed(2);
      }

      function toggleCallDetails(index) {
        document.getElementById(`call-details-${index}`).classList.toggle("expanded");
        document.getElementById(`call-icon-${index}`).classList.toggle("expanded");
      }

      function renderCallItem(call, index) {
        const started  = formatDate(call.startedAt);
        const duration = call.durationMinutes ? `${call.durationMinutes.toFixed(2)} min` : "N/A";
        const cost     = formatCurrency(call.cost);
        const caller   = call.callerName || call.callerNumber || "Unknown";

        return `
          <div class="call-item">
            <div class="call-header" onclick="toggleCallDetails(${index})">
              <div class="call-header-info">
                <div class="call-info-item">
                  <div class="call-info-label">Date &amp; Time</div>
                  <div class="call-info-value">${started}</div>
                </div>
                <div class="call-info-item">
                  <div class="call-info-label">Duration</div>
                  <div class="call-info-value">${duration}</div>
                </div>
                <div class="call-info-item">
                  <div class="call-info-label">Cost</div>
                  <div class="call-info-value">${cost}</div>
                </div>
                <div class="call-info-item">
                  <div class="call-info-label">Caller</div>
                  <div class="call-info-value">${escapeHtml(caller)}</div>
                </div>
              </div>
              <span class="call-expand-icon" id="call-icon-${index}">▼</span>
            </div>
            <div class="call-details" id="call-details-${index}">
              ${call.summary ? `
                <div class="detail-section">
                  <div class="detail-section-title">Summary</div>
                  <div class="detail-content">${escapeHtml(call.summary)}</div>
                </div>` : ""}
              ${call.transcript ? `
                <div class="detail-section">
                  <div class="detail-section-title">Transcript</div>
                  <div class="detail-content">${formatTranscript(call.transcript)}</div>
                </div>` : ""}
              <div class="detail-section">
                <div class="detail-section-title">Details</div>
                ${call.callId        ? `<div class="detail-row"><div class="detail-label">Call ID</div><div class="detail-value">${escapeHtml(call.callId)}</div></div>` : ""}
                ${call.callerNumber  ? `<div class="detail-row"><div class="detail-label">Caller Number</div><div class="detail-value">${escapeHtml(call.callerNumber)}</div></div>` : ""}
                ${call.sipUri        ? `<div class="detail-row"><div class="detail-label">SIP URI</div><div class="detail-value">${escapeHtml(call.sipUri)}</div></div>` : ""}
                ${call.assistantId   ? `<div class="detail-row"><div class="detail-label">Assistant ID</div><div class="detail-value">${escapeHtml(call.assistantId)}</div></div>` : ""}
                ${call.phoneNumberId ? `<div class="detail-row"><div class="detail-label">Phone Number ID</div><div class="detail-value">${escapeHtml(call.phoneNumberId)}</div></div>` : ""}
                ${call.endedReason   ? `<div class="detail-row"><div class="detail-label">Ended Reason</div><div class="detail-value">${escapeHtml(call.endedReason)}</div></div>` : ""}
                ${call.durationSeconds ? `<div class="detail-row"><div class="detail-label">Duration (sec)</div><div class="detail-value">${call.durationSeconds}</div></div>` : ""}
                ${call.endedAt       ? `<div class="detail-row"><div class="detail-label">Ended At</div><div class="detail-value">${formatDate(call.endedAt)}</div></div>` : ""}
              </div>
              ${call.recordingUrl || call.stereoRecordingUrl ? `
                <div class="detail-section">
                  <div class="detail-section-title">Recording</div>
                  ${call.recordingUrl       ? `<div class="detail-row"><div class="detail-label">Recording</div><div class="detail-value"><a href="${call.recordingUrl}" target="_blank" class="recording-link">Download</a></div></div>` : ""}
                  ${call.stereoRecordingUrl ? `<div class="detail-row"><div class="detail-label">Stereo</div><div class="detail-value"><a href="${call.stereoRecordingUrl}" target="_blank" class="recording-link">Download Stereo</a></div></div>` : ""}
                </div>` : ""}
            </div>
          </div>`;
      }

      function filterCallsByMonthYear(calls, month, year) {
        return calls.filter(c => {
          if (!c.startedAt) return false;
          const d = new Date(c.startedAt);
          return d.getMonth() + 1 === parseInt(month) && d.getFullYear() === parseInt(year);
        });
      }

      function calculateStats(calls) {
        let totalCost = 0, totalMinutes = 0;
        calls.forEach(c => {
          if (c.cost) totalCost += c.cost;
          if (c.durationMinutes) totalMinutes += c.durationMinutes;
        });
        const avg = calls.length > 0 ? totalMinutes / calls.length : 0;
        return {
          callCount: calls.length,
          totalCost: Math.round(totalCost * 100) / 100,
          totalMinutes: Math.round(totalMinutes * 100) / 100,
          averageMinutes: Math.round(avg * 100) / 100,
        };
      }

      async function updateStats() {
        const month    = document.getElementById("monthSelector").value;
        const year     = document.getElementById("yearSelector").value;
        const callsList = document.getElementById("callsList");

        callsList.innerHTML = `<div class="loading-state"><div class="spinner"></div> Loading call data…</div>`;

        const authCredentials = sessionStorage.getItem("authCredentials");
        if (!authCredentials) {
          callsList.innerHTML = `<div class="no-calls">Authentication required. Please <a href="/admin/login" style="color:#818cf8">log in</a>.</div>`;
          return;
        }

        try {
          const res  = await fetch("/api/get/calls", {
            headers: { "Content-Type":"application/json", Authorization: authCredentials }
          });
          const data = await res.json();

          if (!data.success) { callsList.innerHTML = `<div class="no-calls">Error loading call data.</div>`; return; }

          const filtered = filterCallsByMonthYear(data.calls, month, year)
            .sort((a, b) => new Date(b.startedAt||0) - new Date(a.startedAt||0));

          const stats = calculateStats(filtered);
          document.getElementById("callCountValue").textContent      = stats.callCount;
          document.getElementById("totalCostValue").textContent      = formatCurrency(stats.totalCost);
          document.getElementById("totalMinutesValue").textContent   = stats.totalMinutes.toFixed(2);
          document.getElementById("averageMinutesValue").textContent = stats.averageMinutes.toFixed(2);

          callsList.innerHTML = filtered.length
            ? filtered.map((c, i) => renderCallItem(c, i)).join("")
            : `<div class="no-calls">No calls found for this period.</div>`;
        } catch (e) {
          console.error(e);
          callsList.innerHTML = `<div class="no-calls">Failed to load call data.</div>`;
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        initializeDateSelectors();
        updateStats();
      });
    </script>
  </body>
</html>
