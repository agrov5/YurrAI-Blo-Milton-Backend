<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Server Logs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0f;
    --surface:   #111118;
    --surface2:  #16161f;
    --border:    #1e1e2e;
    --border2:   #252535;
    --text:      #e2e2f0;
    --muted:     #555570;
    --accent:    #6c63ff;
    --accent2:   #8b5cf6;
    --green:     #22c55e;
    --yellow:    #f59e0b;
    --red:       #ef4444;
    --blue:      #3b82f6;
    --cyan:      #06b6d4;
    --orange:    #f97316;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.4;
  }

  /* ── Topbar ── */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex; align-items: center; gap: 10px;
    height: 52px;
    backdrop-filter: blur(12px);
  }
  .topbar-logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 14px; color: var(--text);
    margin-right: 8px;
    white-space: nowrap;
  }
  .topbar-logo svg { color: var(--accent2); }
  .divider { width: 1px; height: 20px; background: var(--border2); }

  /* ── Toolbar controls ── */
  .ctrl {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 0 10px;
    border-radius: 7px;
    font-size: 12px;
    height: 32px;
    outline: none;
    transition: border-color .15s;
  }
  .ctrl:focus { border-color: var(--accent2); }
  input.ctrl { width: 200px; }
  input.ctrl::placeholder { color: var(--muted); }

  .btn {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 0 14px;
    border-radius: 7px;
    font-size: 12px;
    height: 32px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
    transition: background .15s, border-color .15s;
    font-weight: 500;
  }
  .btn:hover { background: #1e1e2e; border-color: #3a3a50; }
  .btn.danger { color: var(--red); border-color: #3a1a1a; }
  .btn.danger:hover { background: #1e0f0f; }
  .btn.primary { background: #1e1a40; border-color: var(--accent); color: #a78bfa; }
  .btn.primary:hover { background: #252050; }
  .spacer { flex: 1; }

  /* ── Status bar ── */
  .statusbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 20px;
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; color: var(--muted);
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.85)} }
  .stat-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 5px; padding: 2px 8px; font-size: 10px;
  }
  .stat-chip .dot { width: 5px; height: 5px; border-radius: 50%; }
  .dot-green { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red { background: var(--red); }
  .dot-blue { background: var(--blue); }

  /* ── Log list ── */
  #log-list { padding: 12px 20px 40px; display: flex; flex-direction: column; gap: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 80px 0; }
  .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .4; }
  .empty p { font-size: 13px; }

  /* ── Log row ── */
  .log-row {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .log-row:hover { border-color: var(--border2); }
  .log-row.http  { border-left: 3px solid #1d3a6a; }
  .log-row.axios { border-left: 3px solid #2d1b5e; }
  .log-row.app   { border-left: 3px solid #0e3d1e; }
  .log-row.warn  { border-left-color: #6b3a00 !important; }
  .log-row.error { border-left-color: #6b1a1a !important; }

  /* ── Row summary ── */
  .row-summary {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    cursor: pointer;
    user-select: none;
    transition: background .1s;
  }
  .row-summary:hover { background: rgba(255,255,255,.025); }

  /* ── Method / type badges ── */
  .badge {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 5px;
    min-width: 46px; letter-spacing: .3px;
  }
  .badge.GET    { background: #0a2a3d; color: #38bdf8; border: 1px solid #0e3a55; }
  .badge.POST   { background: #0d2e10; color: #4ade80; border: 1px solid #103d14; }
  .badge.PUT    { background: #2a1f00; color: #fbbf24; border: 1px solid #3a2b00; }
  .badge.PATCH  { background: #2a1500; color: #fb923c; border: 1px solid #3a1f00; }
  .badge.DELETE { background: #2e0d0d; color: #f87171; border: 1px solid #3d1111; }
  .badge.AXIOS  { background: #1a0c40; color: #a78bfa; border: 1px solid #26124f; }
  .badge.APP    { background: #0a2810; color: #4ade80; border: 1px solid #0e3516; }

  /* ── Status code ── */
  .status-code {
    font-size: 11px; font-weight: 700;
    min-width: 32px; text-align: center;
    padding: 2px 6px; border-radius: 5px;
  }
  .s2xx { color: #4ade80; background: #0a2210; border: 1px solid #0e3016; }
  .s3xx { color: #60a5fa; background: #0a1830; border: 1px solid #0e2240; }
  .s4xx { color: #fbbf24; background: #2a1e00; border: 1px solid #3a2800; }
  .s5xx { color: #f87171; background: #2e0d0d; border: 1px solid #3d1111; }

  .row-url  { flex: 1; color: #aaa; font-family: 'SF Mono','Fira Mono',monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-ms   { color: var(--muted); font-size: 10px; min-width: 60px; text-align: right; font-family: monospace; }
  .row-ts   { color: #333348; font-size: 10px; min-width: 90px; text-align: right; font-family: monospace; }
  .chevron  { color: var(--muted); font-size: 10px; margin-left: 2px; transition: transform .2s; }
  .chevron.open { transform: rotate(90deg); }

  /* ── Row detail ── */
  .row-detail {
    background: #09090e;
    border-top: 1px solid var(--border);
    display: none;
    padding: 12px 14px;
  }
  .row-detail.open { display: block; }

  /* ── Copy buttons ── */
  .copy-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .copy-btn {
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--muted); padding: 0 10px; border-radius: 6px;
    font-size: 10px; height: 26px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: all .15s;
    font-family: inherit;
  }
  .copy-btn:hover { color: var(--text); border-color: #3a3a50; background: #1a1a2a; }
  .copy-btn.copied { color: var(--green); border-color: #163d16; background: #091a09; }

  /* ── JSON pre ── */
  pre.json-block {
    background: #07070d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'SF Mono','Fira Mono',monospace;
    font-size: 11px; color: #c9d1d9;
    white-space: pre-wrap; word-break: break-all;
    max-height: 340px; overflow-y: auto;
    line-height: 1.6;
  }
  pre.json-block::-webkit-scrollbar { width: 6px; }
  pre.json-block::-webkit-scrollbar-track { background: transparent; }
  pre.json-block::-webkit-scrollbar-thumb { background: #2a2a40; border-radius: 3px; }

  /* ── Scrollbar global ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e1e30; border-radius: 3px; }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-logo">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    Server Logs
  </div>

  <div class="divider"></div>

  <input class="ctrl" type="text" id="f-search" placeholder="Search anything…" oninput="applyFilters()"/>

  <select class="ctrl" id="f-level" onchange="applyFilters()">
    <option value="">All levels</option>
    <option value="info">Info</option>
    <option value="warn">Warn</option>
    <option value="error">Error</option>
  </select>

  <select class="ctrl" id="f-type" onchange="applyFilters()">
    <option value="">All types</option>
    <option value="http">HTTP</option>
    <option value="axios">Axios</option>
    <option value="app">App</option>
  </select>

  <select class="ctrl" id="f-method" onchange="applyFilters()">
    <option value="">All methods</option>
    <option>GET</option><option>POST</option><option>PUT</option>
    <option>PATCH</option><option>DELETE</option>
  </select>

  <select class="ctrl" id="f-status" onchange="applyFilters()">
    <option value="">All statuses</option>
    <option value="2">2xx</option>
    <option value="3">3xx</option>
    <option value="4">4xx</option>
    <option value="5">5xx</option>
  </select>

  <div class="spacer"></div>

  <button class="btn primary" onclick="load()">
    <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Refresh
  </button>

  <button class="btn danger" onclick="confirmClear()">
    <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
    </svg>
    Clear
  </button>
</div>

<!-- Status bar -->
<div class="statusbar">
  <span class="pulse"></span>
  <span id="stat-main">Loading…</span>
  <span id="stat-chips"></span>
  <span class="spacer"></span>
  <span id="stat-refresh" style="font-size:10px;color:#2a2a40;">auto-refresh 10s</span>
</div>

<!-- Log list -->
<div id="log-list"></div>

<script>
  let allLogs = [];
  let filtered = [];

  // ── Helpers ──────────────────────────────────────────────────────────────
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const sc  = s => !s ? '' : s < 300 ? 's2xx' : s < 400 ? 's3xx' : s < 500 ? 's4xx' : 's5xx';
  const fmtMs = n => n != null ? n < 1000 ? n.toFixed(0)+'ms' : (n/1000).toFixed(2)+'s' : '';
  const fmtTs = ts => {
    const d = new Date(ts);
    return d.toLocaleTimeString('en-CA', { hour12: false })
      + '.' + String(d.getMilliseconds()).padStart(3,'0');
  };

  function methodBadge(log) {
    if (log.type === 'axios') return '<span class="badge AXIOS">AXIOS</span>';
    if (log.type === 'app')   return '<span class="badge APP">APP</span>';
    if (log.method) return `<span class="badge ${log.method}">${esc(log.method)}</span>`;
    return '';
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render(logs) {
    filtered = logs;
    const el = document.getElementById('log-list');

    if (!logs.length) {
      el.innerHTML = `
        <div class="empty">
          <div class="empty-icon">◎</div>
          <p>No logs match the current filters</p>
        </div>`;
      return;
    }

    el.innerHTML = logs.map((log, i) => {
      const label  = log.url || log.message || '—';
      const rowCls = [log.type, log.level === 'error' ? 'error' : log.level === 'warn' ? 'warn' : ''].filter(Boolean).join(' ');
      return `
<div class="log-row ${rowCls}">
  <div class="row-summary" onclick="toggle(${i})">
    ${methodBadge(log)}
    ${log.status ? `<span class="status-code ${sc(log.status)}">${log.status}</span>` : ''}
    <span class="row-url">${esc(label)}</span>
    <span class="row-ms">${fmtMs(log.responseTimeMs)}</span>
    <span class="row-ts">${fmtTs(log.timestamp)}</span>
    <span class="chevron" id="chev-${i}">&#9658;</span>
  </div>
  <div class="row-detail" id="det-${i}">
    <div class="copy-strip">
      <button class="copy-btn" onclick="copy(event,${i},'json')">
        <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        Copy JSON
      </button>
      <button class="copy-btn" onclick="copy(event,${i},'curl')">
        <svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        Copy cURL
      </button>
      <button class="copy-btn" onclick="copy(event,${i},'url')">URL</button>
      <button class="copy-btn" onclick="copy(event,${i},'req')">Req Body</button>
      <button class="copy-btn" onclick="copy(event,${i},'res')">Res Body</button>
      <button class="copy-btn" onclick="copy(event,${i},'ip')">IP</button>
    </div>
    <pre class="json-block">${esc(JSON.stringify(log, null, 2))}</pre>
  </div>
</div>`;
    }).join('');
  }

  // ── Toggle detail ────────────────────────────────────────────────────────
  function toggle(i) {
    const det  = document.getElementById('det-'  + i);
    const chev = document.getElementById('chev-' + i);
    det.classList.toggle('open');
    chev.classList.toggle('open');
  }

  // ── Copy ─────────────────────────────────────────────────────────────────
  function copy(e, i, field) {
    e.stopPropagation();
    const log = filtered[i];
    let text = '';
    if (field === 'json') {
      text = JSON.stringify(log, null, 2);
    } else if (field === 'curl') {
      const base = window.location.origin;
      const url  = (log.url || '').startsWith('http') ? log.url : base + (log.url || '');
      const bodyPart = log.reqBody ? ` -d '${JSON.stringify(log.reqBody)}'` : '';
      text = `curl -X ${log.method || 'GET'} '${url}'${bodyPart} -H 'Content-Type: application/json'`;
    } else if (field === 'url') {
      text = log.url || '';
    } else if (field === 'req') {
      text = JSON.stringify(log.reqBody ?? null, null, 2);
    } else if (field === 'res') {
      text = log.resBody || '(empty)';
    } else if (field === 'ip') {
      text = log.ip || '';
    }

    navigator.clipboard.writeText(text).then(() => {
      const btn = e.currentTarget;
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1600);
    });
  }

  // ── Filters ──────────────────────────────────────────────────────────────
  function applyFilters() {
    const q      = document.getElementById('f-search').value.toLowerCase();
    const level  = document.getElementById('f-level').value;
    const type   = document.getElementById('f-type').value;
    const method = document.getElementById('f-method').value;
    const status = document.getElementById('f-status').value;

    const out = allLogs.filter(l => {
      if (level  && l.level  !== level)                         return false;
      if (type   && l.type   !== type)                          return false;
      if (method && l.method !== method)                        return false;
      if (status && !String(l.status || '').startsWith(status)) return false;
      if (q && !JSON.stringify(l).toLowerCase().includes(q))    return false;
      return true;
    });

    updateStatusBar(out.length);
    render(out);
  }

  // ── Status bar ───────────────────────────────────────────────────────────
  function updateStatusBar(shown) {
    document.getElementById('stat-main').textContent =
      'Showing ' + shown + ' of ' + allLogs.length + ' entries';

    const counts = { info: 0, warn: 0, error: 0 };
    allLogs.forEach(l => { if (counts[l.level] !== undefined) counts[l.level]++; });

    document.getElementById('stat-chips').innerHTML = [
      counts.info  ? `<span class="stat-chip"><span class="dot dot-blue"></span>${counts.info} info</span>`   : '',
      counts.warn  ? `<span class="stat-chip"><span class="dot dot-yellow"></span>${counts.warn} warn</span>` : '',
      counts.error ? `<span class="stat-chip"><span class="dot dot-red"></span>${counts.error} error</span>`  : '',
    ].join('');
  }

  // ── Load ─────────────────────────────────────────────────────────────────
  async function load() {
    const tick = document.getElementById('stat-refresh');
    tick.textContent = 'refreshing…';
    try {
      const res  = await fetch('/admin/logs/api?limit=500');
      const data = await res.json();
      allLogs = data.logs || [];
      applyFilters();
    } catch (err) {
      document.getElementById('stat-main').textContent = 'Error: ' + err.message;
    } finally {
      tick.textContent = 'auto-refresh 10s';
    }
  }

  // ── Clear ────────────────────────────────────────────────────────────────
  async function confirmClear() {
    if (!confirm('Clear all in-memory logs?')) return;
    await fetch('/admin/logs/api', { method: 'DELETE' });
    load();
  }

  // ── Auto-refresh ─────────────────────────────────────────────────────────
  load();
  setInterval(load, 10000);
</script>
</body>
</html>
