<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Blo Milton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg:        #050505;
        --surface:   #0e0e0e;
        --surface-2: #161616;
        --border:    rgba(255,255,255,0.08);
        --border-hi: rgba(255,255,255,0.14);
        --text:      #f2f2f2;
        --text-2:    #c8c8c8;
        --muted:     #7a7a7a;
        --muted-2:   #4a4a4a;
        --green:     #22c55e;
        --red:       #f87171;
        --red-dim:   rgba(239,68,68,0.1);
        --r:         8px;
        --r-lg:      12px;
        --r-xl:      16px;
      }

      body {
        font-family: "Figtree", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
        position: relative;
      }

      /* dot-grid background */
      body::before {
        content: "";
        position: fixed; inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0);
        background-size: 24px 24px;
        pointer-events: none; z-index: 0;
      }

      /* top-center ambient glow */
      body::after {
        content: "";
        position: fixed; top: -180px; left: 50%; transform: translateX(-50%);
        width: 700px; height: 500px;
        background: radial-gradient(circle, rgba(255,255,255,0.025) 0%, transparent 65%);
        pointer-events: none; z-index: 0;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-xl);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.03),
                    0 24px 64px rgba(0,0,0,0.6);
        width: 100%; max-width: 400px;
        padding: 2.25rem;
        position: relative; z-index: 1;
      }

      /* Brand */
      .brand {
        display: flex; align-items: center; gap: 0.6rem;
        margin-bottom: 2rem;
      }

      .brand-mark {
        width: 28px; height: 28px; border-radius: 7px;
        background: #fff; display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .brand-mark svg { width: 16px; height: 16px; }

      .brand-name {
        font-size: 0.9rem; font-weight: 700;
        color: var(--text); letter-spacing: -0.01em;
      }

      /* Heading */
      .heading {
        font-size: 1.4rem; font-weight: 700;
        color: var(--text); letter-spacing: -0.025em;
        margin-bottom: 0.3rem;
      }

      .subheading {
        font-size: 0.825rem; color: var(--muted); line-height: 1.5;
        margin-bottom: 1.875rem;
      }

      /* shadcn Input */
      .fg { margin-bottom: 1rem; }

      label {
        display: block;
        font-size: 0.73rem; font-weight: 600;
        color: var(--text-2); margin-bottom: 0.32rem; letter-spacing: 0.01em;
      }

      input.fi {
        width: 100%;
        padding: 0.56rem 0.875rem;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--r);
        color: var(--text); font-size: 0.875rem; font-family: inherit;
        outline: none;
        transition: border-color 0.14s, box-shadow 0.14s;
      }
      input.fi:focus {
        border-color: rgba(255,255,255,0.3);
        box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
      }
      input.fi::placeholder { color: var(--muted-2); }

      /* Error alert */
      .err-alert {
        padding: 0.6rem 0.85rem;
        background: var(--red-dim); color: var(--red);
        border: 1px solid rgba(239,68,68,0.2);
        border-radius: var(--r); font-size: 0.8rem; font-weight: 500;
        margin-bottom: 1rem; display: none; line-height: 1.45;
      }

      /* Submit button */
      .btn-submit {
        width: 100%;
        padding: 0.65rem 1rem;
        background: #f2f2f2; color: #0a0a0a;
        border: none; border-radius: var(--r);
        font-size: 0.875rem; font-weight: 700; font-family: inherit;
        cursor: pointer; margin-top: 0.375rem;
        transition: background 0.14s, transform 0.1s;
        display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      }
      .btn-submit:hover { background: #e0e0e0; }
      .btn-submit:active { transform: scale(0.985); }
      .btn-submit:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }

      /* Spinner */
      .spin {
        width: 13px; height: 13px;
        border: 2px solid rgba(10,10,10,0.2);
        border-top-color: #0a0a0a;
        border-radius: 50%;
        animation: spinning 0.65s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spinning { to { transform: rotate(360deg); } }

      /* Footer text */
      .footer-note {
        margin-top: 1.5rem; text-align: center;
        font-size: 0.72rem; color: var(--muted);
      }

      .status-row {
        display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        margin-top: 0.875rem;
        font-size: 0.72rem; color: var(--muted);
      }

      .status-dot {
        width: 5px; height: 5px; border-radius: 50%; background: var(--green);
        animation: pulse-dot 2.5s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.3; transform: scale(0.6); }
      }

      /* Divider */
      .divider {
        height: 1px; background: var(--border);
        margin: 1.5rem 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.5 1C7.5 1 3 4.5 3 8.5C3 11.538 5.462 14 8.5 14C11.538 14 14 11.538 14 8.5C14 4.5 7.5 1 7.5 1Z" fill="#09090b"/>
            <path d="M7.5 5.5C7.5 5.5 5.5 7.5 5.5 10" stroke="white" stroke-width="1.25" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-name">Blo Milton</span>
      </div>

      <h1 class="heading">Welcome back</h1>
      <p class="subheading">Sign in to access the admin dashboard</p>

      <div id="error-msg" class="err-alert"></div>

      <form id="login-form">
        <div class="fg">
          <label for="username">Username</label>
          <input class="fi" type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required />
        </div>
        <div class="fg">
          <label for="password">Password</label>
          <input class="fi" type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-submit" id="login-btn">Sign in</button>
      </form>

      <div class="divider"></div>

      <div class="status-row">
        <span class="status-dot"></span>
        All systems operational
      </div>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errEl    = document.getElementById('error-msg');
        const btn      = document.getElementById('login-btn');
        errEl.style.display = 'none';

        if (!username || !password) {
          errEl.textContent = 'Please enter both username and password.';
          errEl.style.display = 'block'; return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span> Signing in…';

        try {
          const credentials = username + ':' + password;
          const res = await fetch('/api/get/auth-test', {
            method: 'GET', headers: { Authorization: credentials }
          });
          if (res.ok) {
            sessionStorage.setItem('authCredentials', credentials);
            window.location.href = '/admin/dashboard';
          } else {
            throw new Error('Invalid credentials');
          }
        } catch {
          errEl.textContent = 'Invalid username or password. Please try again.';
          errEl.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });

      window.addEventListener('load', function () {
        const creds = sessionStorage.getItem('authCredentials');
        if (creds) {
          fetch('/api/get/auth-test', { headers: { Authorization: creds } })
            .then(r => { if (r.ok) window.location.href = '/admin/dashboard'; });
        }
      });
    </script>
  </body>
</html>
